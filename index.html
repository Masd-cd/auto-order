<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeliharaan Sistem - MasD VPNStore</title>
    <!-- Menambahkan favicon dari sumber asli Anda -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            /* Animasi masuk background */
            opacity: 0;
            animation: fadeInPage 0.5s ease-in forwards;
        }
        @keyframes fadeInPage {
            to { opacity: 1; }
        }
        
        /* Background dekoratif glow */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            top: 15%;
            left: 20%;
            z-index: -1;
        }
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            bottom: 15%;
            right: 20%;
            z-index: -1;
        }
        
        /* Container Utama */
        .container {
            max-width: 480px;
            width: 100%;
            padding: 40px 30px 30px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            /* Animasi meluncur ke atas */
            transform: translateY(30px);
            opacity: 0;
            animation: slideUpFade 0.8s ease-out 0.2s forwards;
        }
        @keyframes slideUpFade {
            to { transform: translateY(0); opacity: 1; }
        }

        /* --- STYLE KHUSUS BRANDING MASD VPNSTORE --- */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
        }
        .brand-logo-box {
            background-color: rgba(79, 70, 229, 0.2);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            margin-bottom: 16px;
        }
        .brand-logo-svg {
            width: 28px;
            height: 28px;
            color: #818cf8;
        }
        .brand-title {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #60a5fa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .brand-subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.025em;
        }

        /* --- STYLE KHUSUS STATUS MAINTENANCE --- */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: #38bdf8;
            margin-bottom: 24px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        
        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .line {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.08), transparent);
            margin-bottom: 24px;
        }
        
        /* Footer original style */
        .footer-main {
            font-size: 9px;
            color: #475569;
            font-weight: 400;
            letter-spacing: 0.025em;
            margin-bottom: 6px;
        }
        .footer-sub {
            font-size: 10px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- BAGIAN BRANDING MASD VPNSTORE -->
        <div class="brand-header">
            <div class="brand-logo-box">
                <!-- Logo Petir Original Anda -->
                <svg class="brand-logo-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="brand-title">MasD VPNStore</h1>
            <p class="brand-subtitle">Premium VPN Store</p>
        </div>

        <div class="line"></div>

        <!-- BAGIAN STATUS MAINTENANCE -->
        <div>
            <span class="status-badge">
                <span class="status-dot"></span> Pemeliharaan Sistem
            </span>
        </div>

        <h2>Kami Akan Segera Kembali</h2>
        <p class="desc">Saat ini kami sedang melakukan peningkatan performa dan pembaruan sistem terjadwal guna memberikan pengalaman terbaik untuk Anda.</p>
        
        <div class="line"></div>
        
        <!-- BAGIAN FOOTER ORIGINAL ANDA -->
        <div class="mt-12 mb-8 text-center">
            <p class="text-[9px] text-slate-600 tracking-wide">
                &copy; Built by MasD VPNStore 2026.
            </p>
        </div>
        
    </div>

</body>
</html>
